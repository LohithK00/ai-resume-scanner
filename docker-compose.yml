services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_scanner
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://resume_user:resume_password@postgres:5432/resume_scanner
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      - postgres

volumes:
  postgres_data:
